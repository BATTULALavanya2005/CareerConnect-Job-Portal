<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="page-logo">
    <img src="images/careerconnect-logo.png" alt="CareerConnect Logo">
</div>

<div class="container">

<div class="left-section">

<h4>Join Us!</h4>

<h1>Create Account</h1>

<form id="signupForm">

<input 
type="text"
id="name"
placeholder="Full Name"
required>

<input 
type="email"
id="email"
placeholder="Email Address"
required>

<input 
type="password"
id="password"
placeholder="Create Password"
required>

<input 
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<button type="submit">
Sign Up
</button>

</form>

<p>
Already have an account?
<a href="login.html">
Login
</a>
</p>

</div>


<div class="right-section">

<h2>
        Start your career journey<br>
        with CareerConnect
    </h2>

    <img 
    src="images/signup-career.png"
    alt="Career Signup">

</div>

</div>

<script src="signup.js"></script>

</body>
</html>
