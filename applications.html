<!DOCTYPE html>
<html>
<head>
    <title>Applications</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<nav class="navbar">

    <div class="logo">
    <img src="images/careerconnect-logo.png" alt="CareerConnect Logo">
</div>

    <ul>
        <li><a href="dashboard.html">Home</a></li>
        <li><a href="jobs.html">Jobs</a></li>
        <li><a href="applications.html">Applications</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="#" onclick="logout()">Logout</a></li>
    </ul>

</nav>

<div class="main">

    <h1>My Applications</h1>

    <div id="applicationsList"></div>

    <h2 style="margin-top:40px;">Saved Jobs</h2>

    <div id="savedJobsContainer" class="stats">

</div>

</div>

<script src="dashboard.js"></script>

<script>

const applications =
    JSON.parse(localStorage.getItem("applications")) || [];

const container =
    document.getElementById("applicationsList");

if(applications.length === 0){

    container.innerHTML = `
        <div class="card">
            <h3>No Applications Yet</h3>
            <p>Apply for a job from the Jobs page.</p>
        </div>
    `;

}else{

  applications.forEach(app => {

    container.innerHTML += `
        <div class="card">

            <h3>${app.title}</h3>

            <p>
                <strong>Status:</strong>
                ${app.status}
            </p>

            <p>
                <strong>Applied Date:</strong>
                ${app.appliedDate}
            </p>

            <button
                class="remove-btn"
                onclick="removeApplication('${app.title}')">
                Remove Application
            </button>

        </div>
    `;

 });

}

</script>

</body>
</html>
