<!DOCTYPE html>
<html>
<head>
    <title>Software Jobs</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">
    <img src="images/careerconnect-logo.png" alt="CareerConnect Logo">
</div>
</nav>

<div class="main">

<h1>Government Jobs</h1>

    <div class="stats">

    

        <div class="card">
            <h3>SSC Junior Engineer</h3>
            <p><strong>Department:</strong> SSC</p>
            <p><strong>Salary:</strong> ₹45,000/month</p>

            <div class="job-actions">

              <button class="apply-btn"
                  onclick="applyJob('SSC Junior Engineer')">
                  Apply Now
              </button>

              <button class="save-btn-job"
                  onclick="saveJob('SSC Junior Engineer')">
                  Save
              </button>
            </div>
        </div>

        <div class="card">
            <h3>Bank PO</h3>
            <p><strong>Department:</strong> SBI</p>
            <p><strong>Salary:</strong> ₹50,000/month</p>

            <div class="job-actions">

              <button class="apply-btn"
                  onclick="applyJob('Bank PO')">
                  Apply Now
              </button>

              <button class="save-btn-job"
                  onclick="saveJob('Bank PO')">
                  Save
              </button>
            </div>
        </div>

    </div>

</div>



<script src="dashboard.js"></script>

</body>
</html>
