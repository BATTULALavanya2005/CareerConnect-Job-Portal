<!DOCTYPE html>
<html>
<head>
    <title>Software Jobs</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">
    <img src="images/careerconnect-logo.png" alt="CareerConnect Logo">
</div>
</nav>

<div class="main">

<h1>Software Jobs</h1>

<div class="stats">

<div class="card">
    <h3>Frontend Developer</h3>
    <p>Infosys</p>
    <p>Bangalore</p>
    <div class="job-actions">

              <button class="apply-btn"
                  onclick="applyJob('Frontend Developer')">
                  Apply Now
              </button>

              <button class="save-btn-job"
                  onclick="saveJob('Frontend Developer')">
                  Save
              </button>

            </div>
</div>

<div class="card">
    <h3>Java Developer</h3>
    <p>TCS</p>
    <p>Hyderabad</p>
    <div class="job-actions">

              <button class="apply-btn"
                  onclick="applyJob('Java Developer')">
                  Apply Now
              </button>

              <button class="save-btn-job"
                  onclick="saveJob('Java Developer')">
                  Save
              </button>

    </div>
</div>

<div class="card">
    <h3>Python Developer</h3>
    <p>Wipro</p>
    <div class="job-actions">

              <button class="apply-btn"
                  onclick="applyJob('Python Developer')">
                  Apply Now
              </button>

              <button class="save-btn-job"
                  onclick="saveJob('Python Developer')">
                  Save
              </button>

    </div>
</div>

</div>

</div>

<script src="dashboard.js"></script>

</body>
</html>
