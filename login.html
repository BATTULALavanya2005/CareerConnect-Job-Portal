<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerConnect Login</title>
<link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="page-logo">
    <img src="images/careerconnect-logo.png" alt="CareerConnect Logo">
</div>

<div class="container">

    <!-- Left Login Form -->
    <div class="left-section">

        <h4>Hello!</h4>
        <h1>Welcome Back</h1>

        <form id="loginForm">

            <input 
            type="text"
            id="name"
            placeholder="Full Name"
            required>

            <input 
            type="email"
            id="email"
            placeholder="Email Address"
            required>

            <input 
            type="password"
            id="password"
            placeholder="Password"
            required>

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>

    </div>


    <!-- Right Illustration -->
    <div class="right-section">

        <h2>
        Save time and effort<br>
        with Quick Apply
    </h2>

    <img 
    src="images/login-career.png"
    alt="Career Login">

    </div>

</div>






<script src="login.js"></script>

</body>
</html>
