<!DOCTYPE html>
<html>
<head>
    <title>Software Jobs</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">
    <img src="images/careerconnect-logo.png" alt="CareerConnect Logo">
</div>
</nav>

<div class="main">

<h1>Part Time Jobs</h1>

<div class="stats">

<div class="card">
    <h3>Part-Time Data Entry</h3>
    <p>Freelancer Hub</p>
    <div class="job-actions">

              <button class="apply-btn"
                  onclick="applyJob('Freelancer Hub')">
                  Apply Now
              </button>

              <button class="save-btn-job"
                  onclick="saveJob('Freelancer Hub')">
                  Save
              </button>
    </div>
</div>

<div class="card">
    <h3>Online Tutor</h3>
    <p>Chegg</p>
    <div class="job-actions">

              <button class="apply-btn"
                  onclick="applyJob('Chegg')">
                  Apply Now
              </button>

              <button class="save-btn-job"
                  onclick="saveJob('Chegg')">
                  Save
              </button>
    </div>
</div>

</div>

</div>

<script src="dashboard.js"></script>

</body>
</html>
