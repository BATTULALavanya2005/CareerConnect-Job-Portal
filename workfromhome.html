<!DOCTYPE html>
<html>
<head>
    <title>Software Jobs</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">
    <img src="images/careerconnect-logo.png" alt="CareerConnect Logo">
</div>
</nav>

<div class="main">

<h1>Work From Home</h1>

<div class="stats">


<div class="card">
    <h3>Remote React Developer</h3>
    <p>Accenture</p>
    <div class="job-actions">

              <button class="apply-btn"
                  onclick="applyJob('Remote React Developer')">
                  Apply Now
              </button>

              <button class="save-btn-job"
                  onclick="saveJob('Remote React Developer')">
                  Save
              </button>
        
    </div>
</div>

<div class="card">
    <h3>Remote Python Developer</h3>
    <p>Infosys</p>
    <div class="job-actions">

              <button class="apply-btn"
                  onclick="applyJob('Remote Python Developre')">
                  Apply Now
              </button>

              <button class="save-btn-job"
                  onclick="saveJob('Remote Python Developer')">
                  Save
              </button>
    </div>
</div>

</div>
<script src="dashboard.js"></script>

</body>
</html>
