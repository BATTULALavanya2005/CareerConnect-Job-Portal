<!DOCTYPE html>
<html>
<head>
    <title>Software Jobs</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">
    <img src="images/careerconnect-logo.png" alt="CareerConnect Logo">
</div>
</nav>

<div class="main">

<h1>Internships</h1>

<div class="stats">

<div class="card">
    <h3>Web Development Intern</h3>
    <p>Internshala</p>
    <p>3 Months</p>
    <div class="job-actions">

              <button class="apply-btn"
                  onclick="applyJob('Web Development Intern')">
                  Apply Now
              </button>

              <button class="save-btn-job"
                  onclick="saveJob('Web Development Intern')">
                  Save
              </button>

            </div> 
</div>

<div class="card">
    <h3>Java Intern</h3>
    <p>TCS</p>
    <p>2 Months</p>
    <div class="job-actions">

              <button class="apply-btn"
                  onclick="applyJob('Java Intern')">
                  Apply Now
              </button>

              <button class="save-btn-job"
                  onclick="saveJob('Java Intern')">
                  Save
              </button>

    </div> 
</div>

</div>

</div><script src="dashboard.js"></script>

</body>
</html>
